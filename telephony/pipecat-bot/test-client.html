<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voicebot Test Client</title>
  <script src="vendor/livekit-client.umd.js"></script>
  <style>
    * { box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { max-width: 600px; margin: 2rem auto; padding: 1rem; }
    .panel { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
    .panel h3 { margin-top: 0; }
    label { display: block; margin-bottom: 0.5rem; }
    input { width: 100%; padding: 0.5rem; margin-bottom: 1rem; font-size: 1rem; }
    button { width: 100%; padding: 0.75rem; font-size: 1rem; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: #2563eb; color: white; border: none; border-radius: 6px; }
    .btn-danger { background: #dc2626; color: white; border: none; border-radius: 6px; }
    .status { padding: 0.75rem; border-radius: 6px; margin-bottom: 1rem; font-weight: 500; }
    .status.connecting { background: #fef3c7; color: #92400e; }
    .status.connected { background: #d1fae5; color: #065f46; }
    .status.error { background: #fee2e2; color: #991b1b; }
    .logs { max-height: 200px; overflow-y: auto; background: #1e1e1e; color: #e5e5e5; padding: 0.75rem; border-radius: 6px; font-family: monospace; font-size: 0.85rem; }
    .log-entry { margin: 0.25rem 0; }
    .log-entry.info { color: #93c5fd; }
    .log-entry.warn { color: #fcd34d; }
    .log-entry.error { color: #fca5a5; }
    .audio-level { height: 8px; background: #e5e7eb; border-radius: 4px; overflow: hidden; margin-top: 0.5rem; }
    .audio-level-bar { height: 100%; background: #2563eb; width: 0%; transition: width 50ms; }
  </style>
</head>
<body>
  <h1>Voicebot Test Client</h1>

  <div class="panel">
    <h3>Connection</h3>
    <label>LiveKit URL <input id="url" value="ws://localhost:7880"></label>
    <label>Room Name <input id="room" value="voicebot-room"></label>
    <label>Participant Name <input id="name" value="User"></label>
    <button id="joinBtn" class="btn-primary">Join Room</button>
    <button id="leaveBtn" class="btn-danger" disabled>Leave Room</button>
    <div id="status" class="status" style="display:none;"></div>
  </div>

  <div class="panel" id="mediaPanel" style="display:none;">
    <h3>Media</h3>
    <label><input type="checkbox" id="muteMic"> Mute microphone</label>
    <div class="audio-level"><div id="micLevel" class="audio-level-bar"></div></div>
    <p style="margin-top:0.5rem; font-size:0.9rem; color:#666;">
      Speak to the bot. It will respond via your speakers.
    </p>
  </div>

  <div class="panel">
    <h3>Logs</h3>
    <div id="logs" class="logs"></div>
  </div>

  <audio id="remoteAudio" autoplay></audio>

  <script>
    const urlInput = document.getElementById('url');
    const roomInput = document.getElementById('room');
    const nameInput = document.getElementById('name');
    const joinBtn = document.getElementById('joinBtn');
    const leaveBtn = document.getElementById('leaveBtn');
    const statusDiv = document.getElementById('status');
    const mediaPanel = document.getElementById('mediaPanel');
    const muteMic = document.getElementById('muteMic');
    const micLevel = document.getElementById('micLevel');
    const logsDiv = document.getElementById('logs');
    const remoteAudioEl = document.getElementById('remoteAudio');

    const LK = window.LivekitClient;
    let room = null;
    let localAudioTrack = null;
    let audioContext = null;
    let analyser = null;
    let animationFrame = null;

    function log(msg, level = 'info') {
      const entry = document.createElement('div');
      entry.className = `log-entry ${level}`;
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      logsDiv.appendChild(entry);
      logsDiv.scrollTop = logsDiv.scrollHeight;
    }

    function setStatus(text, cls) {
      statusDiv.textContent = text;
      statusDiv.className = `status ${cls}`;
      statusDiv.style.display = text ? 'block' : 'none';
    }

    async function getToken(roomName, identity) {
      const header = { alg: 'HS256', typ: 'JWT' };
      const payload = {
        iss: 'devkey',
        sub: identity,
        nbf: Math.floor(Date.now() / 1000) - 10,
        exp: Math.floor(Date.now() / 1000) + 3600,
        video: {
          room: roomName,
          roomJoin: true,
          canPublish: true,
          canSubscribe: true,
          canPublishData: true
        }
      };
      const b64url = (bytes) => btoa(String.fromCharCode(...new Uint8Array(bytes)))
        .replace(/=/g, '').replace(/\+/g, '-').replace(/\//g, '_');
      const enc = new TextEncoder();
      const data = `${b64url(enc.encode(JSON.stringify(header)))}.${b64url(enc.encode(JSON.stringify(payload)))}`;
      const key = await crypto.subtle.importKey(
        'raw', enc.encode('secret'), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']
      );
      const sig = await crypto.subtle.sign('HMAC', key, enc.encode(data));
      return `${data}.${b64url(sig)}`;
    }

    function startMicLevel(track) {
      if (!audioContext) audioContext = new AudioContext();
      const source = audioContext.createMediaStreamSource(new MediaStream([track.mediaStreamTrack]));
      analyser = audioContext.createAnalyser();
      analyser.fftSize = 256;
      source.connect(analyser);
      const data = new Uint8Array(analyser.frequencyBinCount);
      (function update() {
        analyser.getByteFrequencyData(data);
        let sum = 0;
        for (let i = 0; i < data.length; i++) sum += data[i];
        micLevel.style.width = `${Math.min(100, (sum / data.length / 128) * 100)}%`;
        animationFrame = requestAnimationFrame(update);
      })();
    }

    function stopMicLevel() {
      if (animationFrame) cancelAnimationFrame(animationFrame);
      if (audioContext) { audioContext.close(); audioContext = null; }
      micLevel.style.width = '0%';
    }

    async function join() {
      if (!LK || !LK.Room || !LK.createLocalAudioTrack) {
        log(`livekit-client failed to load (LivekitClient=${typeof LK})`, 'error');
        setStatus('SDK not loaded — check vendor/livekit-client.umd.js', 'error');
        return;
      }
      joinBtn.disabled = true;
      setStatus('Connecting...', 'connecting');

      try {
        const token = await getToken(roomInput.value.trim(), nameInput.value.trim() || 'User');
        room = new LK.Room({ adaptiveStream: true, dynacast: true });

        room.on(LK.RoomEvent.TrackSubscribed, (track, pub, participant) => {
          log(`Subscribed to ${track.kind} from ${participant.identity}`);
          if (track.kind === LK.Track.Kind.Audio) {
            track.attach(remoteAudioEl);
            remoteAudioEl.play().catch((e) => log(`Playback blocked: ${e.message}`, 'warn'));
          }
        });

        room.on(LK.RoomEvent.ParticipantConnected, (p) => log(`Participant connected: ${p.identity}`));
        room.on(LK.RoomEvent.ParticipantDisconnected, (p) => log(`Participant disconnected: ${p.identity}`, 'warn'));

        room.on(LK.RoomEvent.Disconnected, (reason) => {
          log(`Disconnected${reason ? ` (${reason})` : ''}`, 'warn');
          cleanup();
        });

        await room.connect(urlInput.value.trim(), token);
        log('Connected to room');

        remoteAudioEl.play().catch(() => {});

        localAudioTrack = await LK.createLocalAudioTrack({ name: 'microphone' });
        await room.localParticipant.publishTrack(localAudioTrack);
        log('Microphone published');

        startMicLevel(localAudioTrack);
        mediaPanel.style.display = 'block';
        leaveBtn.disabled = false;
        urlInput.disabled = roomInput.disabled = nameInput.disabled = true;
        setStatus('Connected! Speak to the bot.', 'connected');
      } catch (err) {
        log(`Connection failed: ${err.message}`, 'error');
        setStatus(`Error: ${err.message}`, 'error');
        cleanup();
      }
    }

    function cleanup() {
      stopMicLevel();
      if (localAudioTrack) { localAudioTrack.stop(); localAudioTrack = null; }
      if (room) { room.disconnect().catch(() => {}); room = null; }
      remoteAudioEl.srcObject = null;
      mediaPanel.style.display = 'none';
      joinBtn.disabled = false;
      leaveBtn.disabled = true;
      urlInput.disabled = roomInput.disabled = nameInput.disabled = false;
      muteMic.checked = false;
    }

    muteMic.addEventListener('change', () => {
      if (localAudioTrack) {
        localAudioTrack.setEnabled(!muteMic.checked);
        log(muteMic.checked ? 'Microphone muted' : 'Microphone unmuted', muteMic.checked ? 'warn' : 'info');
      }
    });

    joinBtn.addEventListener('click', join);
    leaveBtn.addEventListener('click', () => { log('Leaving room...'); cleanup(); });
    window.addEventListener('beforeunload', () => { if (room) cleanup(); });

    log(`SDK loaded: LivekitClient ${LK ? LK.version || '(version n/a)' : 'MISSING'}`,
        LK && LK.createLocalAudioTrack ? 'info' : 'error');
  </script>
</body>
</html>
