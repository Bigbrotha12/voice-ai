[project]
name = "token-mint"
version = "0.1.0"
description = "Mints short-lived LiveKit room JWTs for voice clients (browser / mobile)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "livekit-api>=1.2",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.scripts]
token-mint = "token_mint.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/token_mint"]
