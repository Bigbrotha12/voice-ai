[project]
name = "voice-mcp"
version = "0.1.0"
description = "High-level voice MCP server wrapping a local Voicebox instance (say / listen / voices)"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3,<4",
    "httpx>=0.27,<1",
]

[project.scripts]
voice-mcp = "voice_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_mcp"]
