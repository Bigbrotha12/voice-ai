# LiveKit media plane as a sibling of the voicebox service. Loaded by
# scripts/stack-up.sh AFTER the upstream compose + ports-override files.
#
# CONFIGURED-KEYS MODE (no more --dev): room access requires JWTs signed
# with LIVEKIT_API_KEY/SECRET from the repo .env. Browser/mobile clients
# must NOT hold those credentials - they get short-lived tokens from the
# token-mint service instead (docker/token-mint.yml).
#
# Host networking (deliberate): WebRTC needs ICE candidates that clients can
# actually reach. With bridge networking + loopback-only port publishes, the
# server advertises its container IP (unreachable from same-host browsers)
# and filters browser mDNS candidates -> "could not establish pc connection".
# On the host network it advertises real host interfaces, which both
# same-host browsers AND containers (via host.containers.internal) reach.
#
# REMAINING EXPOSURE: signaling/media listen on all host interfaces.
# Tokens now gate room access, but consider a firewall scope for
# internet-facing deployments.
services:
  livekit:
    image: docker.io/livekit/livekit-server:v1.13.5
    container_name: livekit
    restart: unless-stopped
    command: --config /etc/livekit/livekit.yaml
    network_mode: host
    environment:
      # livekit's canonical credential binding. MAP-FORM required: this
      # podman-compose mangles ${VAR:?} guards + ": " separators inside
      # list-form entries (silently drops them - verified 2026-08-25).
      # NOTE the literal space after the colon - livekit's parser demands
      # exactly "key: secret".
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      # :Z relabels for SELinux Enforcing hosts (same lesson as
      # ports-override.yml's label=disable)
      - ${REPO_ROOT}/docker/livekit.yaml:/etc/livekit/livekit.yaml:ro,Z

# NOTE: no compose `networks:` - the bot reaches LiveKit via
# ws://host.containers.internal:7880 (see voicebot.yml).
